# gdsfill fill config for gf180mcuD (make gds-fill --config-file). Only density/deviation
# are honored; fill-square geometry (size/spacing) is hardcoded per layer in gdsfill's
# gf180mcu backend, unlike e.g. ihp-sg13cmos5l. Values below are gdsfill's own gf180mcuD
# defaults; commented lines are either hardcoded (shown for reference only) or confirmed
# to have no effect.

PDK: gf180mcuD

layers:
  COMP:
    algorithm: Square
    density: 40
    deviation: 15
    # min_width: 5.0    # hardcoded (DCF_SIZE_UM), not configurable for gf180mcu
    # min_space: 3.0    # hardcoded (DCF_SPACE_UM), not configurable for gf180mcu

  Poly2:
    algorithm: Overlap
    density: 20
    deviation: 6

  Metal1:
    algorithm: Square
    density: 35
    deviation: 5
    # min_width: 2.0    # hardcoded (DM_SIZE_UM), not configurable for gf180mcu
    # min_space: 1.2    # hardcoded (DM_SPACE_UM), not configurable for gf180mcu

  Metal2:
    algorithm: Square
    density: 35
    deviation: 5

  Metal3:
    algorithm: Square
    density: 35
    deviation: 5

  Metal4:
    algorithm: Square
    density: 35
    deviation: 5

  Metal5:
    algorithm: Square
    density: 35
    deviation: 5
    # min_space: 2.0    # possibly DM_SPACE_TOP_UM if treated as top metal - hardcoded, not configurable

# Tested, no measurable effect on gf180mcuD - kept as a record of what was tried:
# tile_width: 100
# margin: 0
# edge_margin: 0
# border: 0
# keepout_margin: 0
