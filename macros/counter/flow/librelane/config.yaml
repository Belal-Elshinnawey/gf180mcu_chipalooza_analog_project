meta:
  version: 3
  flow: Classic
  substituting_steps:

    # Magic reports some overlaps which can be ignored
    Checker.IllegalOverlap: null

    "+OpenROAD.DetailedRouting": "Odb.InsertECOBuffers"
    "+Odb.InsertECOBuffers": "OpenROAD.DetailedRouting"

INSERT_ECO_BUFFERS:
  # === East Pads ===
  # - target: output19/X # enable_i
  # buffer: sg13cmos5l_buf_4
  # === END OF ECO_BUFFERS ===
    
DESIGN_NAME: counter_top
VERILOG_FILES: ["dir::../../rtl/constants.sv",
"dir::../../rtl/counter.sv",
"dir::../../rtl/counter_top.sv"]

# Enable plugin for better SystemVerilog support
# USE_SLANG: True

# The sg13cmos5l PDK already defaults to KLayout for GDS streamout
# PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Layout / Floorplan Rules
DIE_AREA: [0, 0, 200, 100]
PL_TARGET_DENSITY_PCT: 40
GRT_ALLOW_CONGESTION: true
RUN_MAGIC_DRC: true
RUN_CTS: true

# Valid values are AREA 0-3 and DELAY 0-4
# DELAY 4 = fastest, but largest area
# AREA 3 = slowest, but smallest area
SYNTH_STRATEGY: DELAY 4
# MAX_FANOUT_CONSTRAINT: 6
# RT_MAX_LAYER: Metal4
IO_PIN_ORDER_CFG: dir::pin_order.cfg
PDN_MULTILAYER: false
FP_SIZING: absolute

# SDC files
PNR_SDC_FILE: dir::impl.sdc
SIGNOFF_SDC_FILE: dir::signoff.sdc

# Power / ground nets
VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"

# Clock
CLOCK_PORT: clock_i
CLOCK_NET: clock_i
CLOCK_PERIOD: 20 # in ns == 50 MHz

# Define Standard Cells
STD_CELL_LIBRARY: gf180mcu_fd_sc_mcu7t5v0

# Technology LIBs
# gf180mcu_fd_sc_mcu7t5v0 ships one corner file per (process, temp, voltage-rail) combination.
# This macro runs at VDD=3.3V, so only the 3v-rail files apply (the library also has 1.8V and
# 5.0V rail files for other supply choices, not used here).
CELL_LIBS:
  "*_tt_3v30_025C":
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__tt_025C_3v30.lib

  "*_ff_3v60_125C":
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_125C_3v60.lib

  "*_ff_3v60_n40C":
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ff_n40C_3v60.lib

  "*_ss_3v00_125C":
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_125C_3v00.lib

  "*_ss_3v00_n40C":
    - pdk_dir::libs.ref/gf180mcu_fd_sc_mcu7t5v0/lib/gf180mcu_fd_sc_mcu7t5v0__ss_n40C_3v00.lib

# Corners
STA_CORNERS:
  - nom_tt_3v30_025C
  - nom_ff_3v60_125C
  - nom_ff_3v60_n40C
  - nom_ss_3v00_125C
  - nom_ss_3v00_n40C

DEFAULT_CORNER: nom_tt_3v30_025C

# Fix setup violations
# PL_RESIZER_SETUP_SLACK_MARGIN: 0.60
# GRT_RESIZER_SETUP_SLACK_MARGIN: 0.55

# Fix hold violations
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
PL_RESIZER_HOLD_MAX_BUFFER_PCT: 100
